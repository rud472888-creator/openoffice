name: Every Office iPad
on:
  push:
    branches: [feat/every-office-ipad]
    paths:
      - 'apps/ipad/**'
      - 'apps/ipad-web/**'
      - 'apps/ipad-sheets/**'
      - 'apps/ipad-slides/**'
      - '.github/workflows/ipad.yml'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'apps/ipad/**'
      - 'apps/ipad-web/**'
      - 'apps/ipad-sheets/**'
      - 'apps/ipad-slides/**'
      - '.github/workflows/ipad.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test and bundle offline document editors
        run: bash apps/ipad/scripts/verify-web.sh
      - name: Install project generator
        run: brew install xcodegen
      - name: Build and test on iPad Simulator
        run: bash apps/ipad/scripts/verify-simulator.sh
      - name: Upload simulator test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ipad-simulator-results
          path: apps/ipad/build/*.xcresult
          if-no-files-found: ignore
